<section class="hero" id="inicio">
  <div class="hero__inner">
    <div class="hero__content">
      <h1 class="hero__title">Andrés Felipe Guerrero Macías</h1>
      <p class="hero__role">Desarrollador Full Stack</p>
      <p class="hero__description">
        Ingeniero de Sistemas con 3+ años de experiencia en banca y finanzas.
        Construyo soluciones de extremo a extremo: desde interfaces hasta bases de datos y servicios en la nube.
      </p>
      <div class="hero__actions">
        <a href="assets/cv.pdf" download class="btn btn--primary">Descargar CV</a>
        <div class="hero__email-pill" [ngClass]="{ 'hero__email-pill--open': emailExpanded }">
          <button
            class="hero__email-trigger"
            (click)="toggleEmail()"
            [attr.aria-expanded]="emailExpanded"
            aria-label="Mostrar correo"
            type="button"
          >
            <!-- Icono sobre -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20 4H4C2.9 4 2 4.9 2 6v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4-8 5-8-5V6l8 5 8-5v2z"/></svg>
          </button>
          <span class="hero__email-text">pipegmacias00&#64;gmail.com</span>
          <button
            class="hero__email-copy"
            (click)="copyEmail()"
            [attr.aria-label]="copied ? 'Copiado' : 'Copiar correo'"
            type="button"
          >
            <svg *ngIf="!copied" width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4C2.9 1 2 1.9 2 3v14h2V3h12V1zm3 4H8C6.9 5 6 5.9 6 7v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
            <svg *ngIf="copied"  width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.2 4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/></svg>
          </button>
        </div>
        <a href="https://www.linkedin.com/in/andres-felipe-guerrero-macias-113926185/" target="_blank" rel="noopener" class="hero__icon-btn" aria-label="LinkedIn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.36V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.59 0 4.25 2.36 4.25 5.43v6.31zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zm1.78 13.02H3.56V9h3.56v11.45zM22.23 0H1.77C.79 0 0 .77 0 1.72v20.56C0 23.23.79 24 1.77 24h20.46C23.21 24 24 23.23 24 22.28V1.72C24 .77 23.21 0 22.23 0z"/></svg>
        </a>
      </div>
    </div>
    <div class="hero__image-wrapper">
      <img
        src="assets/perfil.jpeg"
        alt="Foto de perfil de Andrés Felipe Guerrero Macías"
        class="hero__image"
      />
    </div>
  </div>
</section>
